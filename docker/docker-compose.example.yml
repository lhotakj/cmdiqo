# Example standalone docker-compose.yml for Cmdiqo
# Deploy this file alongside your .env file and a ./config directory.
services:
  cmdiqo-bot:
    image: lhotakj/cmdiqo-bot:latest
    container_name: cmdiqo-bot
    restart: unless-stopped

    # Host networking is required for arp-scan LAN discovery
    network_mode: host

    # Only used if switching to bridge networking:
    ports:
      - "${HUB_PORT:-8765}:8765"

    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:?set SLACK_BOT_TOKEN in .env}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:?set SLACK_APP_TOKEN in .env}
      # Restrict commands to specific Slack user IDs:
      # ALLOWED_USERS: "U0123ABCDEF,U0456GHIJKL"
      # Restrict bot to specific channels:
      # ALLOWED_CHANNELS: "C0123CHANNEL"
      # Shared secret for remote LAN agents connecting to the embedded Hub:
      # AGENT_TOKEN: "change-me-long-random-string"
      # HUB_PORT: "8765"
      # HUB_ENABLED: "true"
      # SHELL_TIMEOUT: "120"
      # LOG_LEVEL: "INFO"

    volumes:
      # Host Docker daemon management:
      - /var/run/docker.sock:/var/run/docker.sock
      # Host docker compose project directory:
      - /docker:/docker
      # External custom command configuration:
      - ./config:/config:ro
