# ============================================================================
# shango-bot command and alias definitions
# ----------------------------------------------------------------------------
# Top-level sections:
#   aliases:  Prefix substitutions (e.g. /home -> /host home)
#   commands: Command definitions matching /lan or /host {host} ...
#
# Each command entry:
#   name        unique identifier (shown in logs/replies)
#   trigger     what you type in Slack; {placeholders} capture a single word
#   description shown in the built-in help (type "/lan" or "/host" with no arguments)
#   kind        "python" | "shell" | "ps1"
#               - python: calls a function inside the container
#               - shell : bash locally, or on a Linux/macOS agent if target is set
#               - ps1   : PowerShell on a Windows agent (requires target)
#   target      OPTIONAL agent name to run the command on (e.g. "{host}").
#               Without target (or target: local), runs inside the bot container.
#   run         command line; may use {placeholder} values
#   cwd         OPTIONAL working directory (container path, or agent path if target set)
#   timeout     OPTIONAL seconds, default: env SHELL_TIMEOUT (120)
#   handler     (kind: python) "module.submodule:function" inside the bot package
#
# Built-in commands (not defined here): /lan agents list, /lan version
# ============================================================================

aliases:
  - name: home
    input: "/home"
    output: "/host home"
    description: "Shortcut alias targeting host 'home'"
    details: "Translates any command starting with /home to /host home. For example, '/home docker ps' becomes '/host home docker ps'."
    examples:
      - "/home docker ps"
      - "/home uptime"
      - "/home docker restart plex"

  - name: wol
    input: "/wol"
    output: "/lan wake"
    description: "Shortcut alias for Wake-on-LAN booting"
    details: "Translates '/wol <target>' directly to '/lan wake <target>' to boot a machine over the network."
    examples:
      - "/wol 00:11:22:33:44:55"
      - "/wol 192.168.1.50"

commands:
  # ---- LAN operations (/lan) -----------------------------------------------
  - name: lan-devices-list
    category: lan
    trigger: "/lan devices list"
    description: "List all devices seen on the local network (ARP scan)"
    details: "Performs an ARP broadcast scan on the local subnet via arp-scan. Returns IP addresses, MAC addresses, and hardware vendor information. Falls back to kernel neighbour table (ip neigh) if arp-scan is unavailable."
    examples:
      - "/lan devices list"
    kind: python
    handler: "commands.devices:list_devices"

  - name: lan-wake
    category: lan
    trigger: "/lan wake {target}"
    description: "Send Wake-on-LAN magic packet to boot a machine"
    details: "Constructs and broadcasts a UDP magic packet (6x 0xFF followed by 16 repetitions of target MAC) on port 9. Target can be a MAC address (00:11:22:33:44:55) or an IP address (automatically resolved via local ARP cache). Target machine must have Wake-on-LAN enabled in BIOS/UEFI."
    examples:
      - "/lan wake 00:11:22:33:44:55"
      - "/lan wake 192.168.1.50"
    kind: python
    handler: "commands.devices:send_wake_on_lan"

  - name: lan-ping
    category: lan
    trigger: "/lan ping {host}"
    description: "Ping a host or IP from the Hub container"
    details: "Sends 3 ICMP echo request packets to verify network connectivity and latency to a local or remote host from the Shango container."
    examples:
      - "/lan ping 192.168.1.1"
      - "/lan ping nas.lan"
    kind: python
    handler: "commands.devices:ping_host"

  # ---- Host-agnostic operations (/host <host> <action>) --------------------
  # System Health & Performance
  - name: host-uptime
    category: system
    trigger: "/host {host} uptime"
    description: "Show system uptime and load average"
    details: "Runs the 'uptime' command on the target host, displaying how long the machine has been running, number of active users, and 1, 5, and 15-minute load averages."
    examples:
      - "/host home uptime"
      - "/host nas uptime"
    kind: shell
    target: "{host}"
    run: "uptime"

  - name: host-memory
    category: system
    trigger: "/host {host} memory"
    description: "Show free and used RAM memory"
    details: "Runs 'free -h' on the target host to display total, used, free, shared, buffer/cache, and available physical and swap memory in human-readable units."
    examples:
      - "/host home memory"
      - "/host nas memory"
    kind: shell
    target: "{host}"
    run: "free -h"

  - name: host-disk
    category: system
    trigger: "/host {host} disk"
    description: "Disk usage on {host}"
    details: "Executes 'df -h' on the target host to report filesystem sizes, used space, available space, percentage capacity, and mount points."
    examples:
      - "/host home disk"
      - "/host nas disk"
    kind: shell
    target: "{host}"
    run: "df -h"

  - name: host-top
    category: system
    trigger: "/host {host} top"
    description: "Top CPU-consuming processes on {host}"
    details: "Inspects running processes sorted by percentage CPU usage, returning the top 10 resource-intensive processes with user, PID, CPU%, MEM%, and command line."
    examples:
      - "/host home top"
      - "/host nas top"
    kind: shell
    target: "{host}"
    run: "ps aux --sort=-%cpu | head -n 11"

  # Service Management
  - name: host-service-status
    category: services
    trigger: "/host {host} service status {service}"
    description: "Check status of a system service"
    details: "Queries systemd via 'systemctl status {service} --no-pager' to inspect active state, daemon status, PID, memory, and recent journal log output."
    examples:
      - "/host nas service status smbd"
      - "/host home service status nginx"
    kind: shell
    target: "{host}"
    run: "systemctl status {service} --no-pager"
    timeout: 30

  - name: host-service-restart
    category: services
    trigger: "/host {host} service restart {service}"
    description: "Restart a system service"
    details: "Restarts the specified systemd service unit via 'systemctl restart {service}'. Useful for applying configuration updates or recovering stalled daemons."
    examples:
      - "/host nas service restart smbd"
      - "/host home service restart nginx"
    kind: shell
    target: "{host}"
    run: "systemctl restart {service}"
    timeout: 60

  # Docker Management
  - name: host-docker-ps
    category: docker
    trigger: "/host {host} docker ps"
    description: "List running docker containers on {host}"
    details: "Lists currently active Docker containers on the specified host, formatting columns cleanly with container name, image, and status/uptime."
    examples:
      - "/host home docker ps"
      - "/host nas docker ps"
    kind: shell
    target: "{host}"
    run: "docker ps --format '{{.Names}} | {{.Image}} | {{.Status}}'"

  - name: host-docker-restart
    category: docker
    trigger: "/host {host} docker restart {service}"
    description: "Restart a docker compose project on {host}"
    details: "Navigates to the service working directory (/docker/{service}) on the target host and runs 'docker compose restart {service}'."
    examples:
      - "/host home docker restart plex"
      - "/host home docker restart vaultwarden"
    kind: shell
    target: "{host}"
    run: "docker compose restart {service}"
    cwd: "/docker/{service}"
    timeout: 300

  - name: host-docker-logs
    category: docker
    trigger: "/host {host} docker logs {service}"
    description: "Tail last 50 log lines of a docker container"
    details: "Fetches the most recent 50 lines of container standard output and standard error logs via 'docker logs --tail 50 {service}'."
    examples:
      - "/host home docker logs pihole"
      - "/host home docker logs plex"
    kind: shell
    target: "{host}"
    run: "docker logs --tail 50 {service}"
    timeout: 60

  - name: host-docker-stats
    category: docker
    trigger: "/host {host} docker stats"
    description: "Snapshot of container CPU, RAM, and network usage"
    details: "Performs a single, non-streaming query of Docker container performance metrics ('docker stats --no-stream'), reporting live CPU percentage, memory usage/limit, and network I/O."
    examples:
      - "/host home docker stats"
    kind: shell
    target: "{host}"
    run: "docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}'"
    timeout: 60

  # Windows Agent Management (ps1)
  - name: host-win-updates
    category: windows
    trigger: "/host {host} win updates"
    description: "Installed Windows hotfixes on {host}"
    details: "Queries Win32_QuickFixEngineering via PowerShell Get-CimInstance to list the 10 most recently installed Windows quality updates, security hotfixes, and KB numbers."
    examples:
      - "/host WIN-PC win updates"
      - "/host DESKTOP-01 win updates"
    kind: ps1
    target: "{host}"
    run: "Get-CimInstance Win32_QuickFixEngineering | Sort-Object InstalledOn -Descending | Select-Object -First 10 HotFixID, InstalledOn | Format-Table -AutoSize"
    timeout: 180

  - name: host-win-memory
    category: windows
    trigger: "/host {host} win memory"
    description: "Memory usage on Windows machine"
    details: "Queries Win32_OperatingSystem via PowerShell Get-CimInstance to report total installed physical RAM (GB) and currently free/available RAM (GB)."
    examples:
      - "/host WIN-PC win memory"
    kind: ps1
    target: "{host}"
    run: "Get-CimInstance Win32_OperatingSystem | Select-Object @{Name='TotalRAM_GB';Expression={[math]::Round($_.TotalVisibleMemorySize/1MB,2)}}, @{Name='FreeRAM_GB';Expression={[math]::Round($_.FreePhysicalMemory/1MB,2)}} | Format-Table -AutoSize"
    timeout: 60

  - name: host-win-services
    category: windows
    trigger: "/host {host} win services"
    description: "Running Windows services"
    details: "Queries Windows Service Control Manager via PowerShell Get-Service to list active running services with their system name and friendly display name."
    examples:
      - "/host WIN-PC win services"
    kind: ps1
    target: "{host}"
    run: "Get-Service | Where-Object {$_.Status -eq 'Running'} | Select-Object -First 25 Name, DisplayName | Format-Table -AutoSize"
    timeout: 60

  - name: host-win-reboot
    category: windows
    trigger: "/host {host} win reboot"
    description: "Reboot Windows machine after 10 seconds warning"
    details: "Issues Windows shutdown utility ('shutdown /r /t 10') with a comment banner to safely reboot the remote machine after giving users a 10-second warning."
    examples:
      - "/host WIN-PC win reboot"
    kind: ps1
    target: "{host}"
    run: "shutdown /r /t 10 /c 'Reboot requested from Slack'"
    timeout: 60
