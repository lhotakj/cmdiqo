# ============================================================================
# cmdiqo-bot command and alias definitions
# ----------------------------------------------------------------------------
# Top-level sections:
#   aliases:  Prefix substitutions (e.g. /home -> /host home)
#   commands: Command definitions matching /lan or /host {host} ...
#
# Each command entry:
#   name        unique identifier (shown in logs/replies)
#   trigger     what you type in Slack; {placeholders} capture arguments
#               (Commands containing {host} automatically target that host agent)
#   description shown in the built-in help (type "/lan" or "/host" with no arguments)
#   details     operational notes displayed in "/help <topic>"
#   examples    list of copy-pasteable command examples
#   command     MANDATORY map of execution commands, supporting up to three kinds:
#               - python: calls a function inside the bot package (runs on any OS)
#               - shell : bash command (runs on Linux agent or local container)
#               - ps1   : PowerShell command (runs on Windows agent)
#               When both shell and ps1 are provided, the bot routes automatically
#               based on the target agent's operating system platform.
#   config      OPTIONAL arbitrary configuration object (dict, list, or primitive)
#               accessible to handlers or parameterized in commands (e.g. config.domains)
#   cwd         OPTIONAL working directory (container path, or agent path)
#   timeout     OPTIONAL seconds, default: env SHELL_TIMEOUT (120)
#
# Built-in commands (not defined here): /lan agents list, /lan version
# ============================================================================

aliases:
  - name: home
    input: "/home"
    output: "/host home"
    description: "Shortcut alias targeting host 'home'"
    details: "Translates any command starting with /home to /host home. For example, '/home docker ps' becomes '/host home docker ps'."
    examples:
      - "/home docker ps"
      - "/home uptime"
      - "/home docker restart plex"

  - name: wol
    input: "/wol"
    output: "/lan wake"
    description: "Shortcut alias for Wake-on-LAN booting"
    details: "Translates '/wol <target>' directly to '/lan wake <target>' to boot a machine over the network."
    examples:
      - "/wol 00:11:22:33:44:55"
      - "/wol 192.168.1.50"

commands:
  # ---- LAN operations (/lan) -----------------------------------------------
  - name: lan-devices-list
    trigger: "/lan devices list"
    description: "List all devices seen on the local network (ARP scan)"
    details: "Performs an ARP broadcast scan on the local subnet via arp-scan. Returns IP addresses, MAC addresses, and resolved host names. Falls back to kernel neighbour table (ip neigh) if arp-scan is unavailable."
    examples:
      - "/lan devices list"
    command:
      python: "commands.devices:list_devices"

  - name: lan-wake
    trigger: "/lan wake {target}"
    description: "Send Wake-on-LAN magic packet to boot a machine"
    details: "Constructs and broadcasts a UDP magic packet (6x 0xFF followed by 16 repetitions of target MAC) on port 9. Target can be a MAC address (00:11:22:33:44:55) or an IP address (automatically resolved via local ARP cache). Target machine must have Wake-on-LAN enabled in BIOS/UEFI."
    examples:
      - "/lan wake 00:11:22:33:44:55"
      - "/lan wake 192.168.1.50"
    command:
      python: "commands.devices:send_wake_on_lan"

  - name: lan-ping
    trigger: "/lan ping {host}"
    description: "Ping a host or IP from the Hub container"
    details: "Sends 3 ICMP echo request packets to verify network connectivity and latency to a local or remote host from the Cmdiqo container."
    examples:
      - "/lan ping 192.168.1.1"
      - "/lan ping nas.lan"
    command:
      python: "commands.devices:ping_host"

  # ---- User Management (OS Agnostic) ---------------------------------------
  - name: host-users
    trigger: "/host {host} users"
    description: "List all OS users on {host} (active ✔️ or locked 🚫)"
    details: "Lists all local OS users on the target host indicating whether each user account is active (✔️) or locked (🚫)."
    examples:
      - "/host home users"
      - "/host AMD users"
    command:
      python: "commands.users:manage_users"

  - name: host-user
    trigger: "/host {host} user {user} {action}"
    description: "Manage a user account on {host} (status | disable | enable)"
    details: "Displays user details and session duration ('status'), locks account ('disable'), or unlocks account ('enable') on Windows or Linux target host."
    examples:
      - "/host home user john status"
      - "/host AMD user Administrator status"
      - "/host home user john disable"
      - "/host AMD user tempuser enable"
    command:
      python: "commands.users:manage_users"

  - name: host-user-status
    trigger: "/host {host} user {user}"
    description: "Show user info, status (✔️/🚫), and session duration"
    details: "Displays user profile details including full name, home directory, status (✔️ active or 🚫 locked), and active session duration (h, m, s)."
    examples:
      - "/host home user john"
      - "/host AMD user Administrator"
    command:
      python: "commands.users:manage_users"

  - name: host-screentime
    trigger: "/host {host} screentime"
    description: "Show active logged-in user sessions, state, and idle time on {host}"
    details: "Queries active logged in console and remote desktop sessions on Windows (quser) or Linux (w/who), displaying username, session state, idle time, and logon timestamp."
    examples:
      - "/host PC-KIDS screentime"
      - "/host home screentime"
    command:
      shell: "w -h 2>/dev/null || who -u"
      ps1: "if (Get-Command quser.exe -ErrorAction SilentlyContinue) { quser.exe } else { Get-CimInstance Win32_LoggedOnUser | Select-Object -ExpandProperty Antecedent | Where-Object { $_ -like '*Name=*' } | Select-Object -Unique }"

  - name: host-restrict-user-set
    trigger: "/host {host} restrict {user} set {schedule}"
    description: "Enforce allowed logon hours for {user} on {host}"
    details: "Restricts allowed login hours for a specific user on Windows (net user /time) or Linux (/etc/security/time.conf). Days: M, T, W, Th, F, Sa, Su. Range: M-F, Sa-Su. Hours: 24h format (e.g. 08:00-20:00). Separate multiple rules with semicolon."
    examples:
      - "/host PC-KIDS restrict jonas set M-F,08:00-20:00;Sa-Su,09:00-21:00"
      - "/host PC-KIDS restrict jonas set M-F,16:00-20:00"
    command:
      python: "commands.restrict:manage_restrict"

  - name: host-restrict-user-status
    trigger: "/host {host} restrict {user} status"
    description: "Check allowed logon hours status for {user} on {host}"
    details: "Displays the active logon hours restrictions for a specific user on the target host."
    examples:
      - "/host PC-KIDS restrict jonas status"
    command:
      python: "commands.restrict:manage_restrict"

  - name: host-restrict-user-off
    trigger: "/host {host} restrict {user} off"
    description: "Remove logon hours restriction for {user} on {host} (restore 24/7)"
    details: "Clears logon time limits for a specific user, restoring unlimited 24/7 access (/time:all)."
    examples:
      - "/host PC-KIDS restrict jonas off"
    command:
      python: "commands.restrict:manage_restrict"

  - name: host-restrict-set
    trigger: "/host {host} restrict set {schedule}"
    description: "Enforce allowed logon hours on {host}"
    details: "Restricts allowed login hours for non-admin accounts on Windows (net user /time) or Linux (/etc/security/time.conf). Days: M, T, W, Th, F, Sa, Su. Range: M-F, Sa-Su. Hours: 24h format (e.g. 08:00-20:00). Separate multiple rules with semicolon."
    examples:
      - "/host PC-KIDS restrict set M-F,08:00-20:00;Sa-Su,09:00-21:00"
      - "/host PC-KIDS restrict set M-F,16:00-20:00"
    command:
      python: "commands.restrict:manage_restrict"

  - name: host-restrict-status
    trigger: "/host {host} restrict status"
    description: "Check allowed logon hours status for accounts on {host}"
    details: "Displays the active logon hours restrictions for user accounts on the target host."
    examples:
      - "/host PC-KIDS restrict status"
    command:
      python: "commands.restrict:manage_restrict"

  - name: host-restrict-off
    trigger: "/host {host} restrict off"
    description: "Remove logon hours restrictions on {host} (restore 24/7)"
    details: "Clears all logon time limits on user accounts, restoring unlimited 24/7 access (/time:all)."
    examples:
      - "/host PC-KIDS restrict off"
    command:
      python: "commands.restrict:manage_restrict"

  - name: direct-restrict-set
    trigger: "/restrict {host} set {schedule}"
    description: "Enforce allowed logon hours on {host} (shortcut)"
    details: "Shortcut for /host {host} restrict set {schedule}."
    examples:
      - "/restrict PC-KIDS set M-F,08:00-20:00;Sa-Su,09:00-21:00"
    command:
      python: "commands.restrict:manage_restrict"

  - name: direct-restrict-status
    trigger: "/restrict {host} status"
    description: "Check allowed logon hours status on {host} (shortcut)"
    details: "Shortcut for /host {host} restrict status."
    examples:
      - "/restrict PC-KIDS status"
    command:
      python: "commands.restrict:manage_restrict"

  - name: direct-restrict-off
    trigger: "/restrict {host} off"
    description: "Remove logon hours restrictions on {host} (shortcut)"
    details: "Shortcut for /host {host} restrict off."
    examples:
      - "/restrict PC-KIDS off"
    command:
      python: "commands.restrict:manage_restrict"

  # ---- System Health & Performance (OS Agnostic) ---------------------------
  - name: host-uptime
    trigger: "/host {host} uptime"
    description: "Show system uptime and load average"
    details: "Displays system uptime. Runs 'uptime' on Linux or queries Win32_OperatingSystem via PowerShell on Windows."
    examples:
      - "/host home uptime"
      - "/host AMD uptime"
    command:
      shell: "uptime"
      ps1: "$b = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime; $u = (Get-Date) - $b; 'Uptime: {0}d {1}h {2}m {3}s (Booted: {4:yyyy-MM-dd HH:mm:ss})' -f [int]$u.TotalDays, $u.Hours, $u.Minutes, $u.Seconds, $b"

  - name: host-memory
    trigger: "/host {host} memory"
    description: "Show free and used RAM memory"
    details: "Displays total, free, and used physical RAM. Uses 'free -h' on Linux and PowerShell Win32_OperatingSystem on Windows."
    examples:
      - "/host home memory"
      - "/host AMD memory"
    command:
      shell: "free -h"
      ps1: "Get-CimInstance Win32_OperatingSystem | Select-Object @{Name='Total_GB';Expression={[math]::Round($_.TotalVisibleMemorySize/1MB,2)}}, @{Name='Free_GB';Expression={[math]::Round($_.FreePhysicalMemory/1MB,2)}}, @{Name='Used_GB';Expression={[math]::Round(($_.TotalVisibleMemorySize - $_.FreePhysicalMemory)/1MB,2)}}, @{Name='UsedPercent';Expression={[math]::Round((($_.TotalVisibleMemorySize - $_.FreePhysicalMemory)/$_.TotalVisibleMemorySize)*100,1)}} | Format-Table -AutoSize"

  - name: host-disk
    trigger: "/host {host} disk"
    description: "Disk usage on {host}"
    details: "Reports filesystem and drive usage. Runs 'df -h' on Linux or queries Win32_LogicalDisk via PowerShell on Windows."
    examples:
      - "/host home disk"
      - "/host AMD disk"
    command:
      shell: "df -h"
      ps1: 'Get-CimInstance Win32_LogicalDisk -Filter ''DriveType=3'' | Select-Object DeviceID, VolumeName, @{Name=''Total_GB'';Expression={[math]::Round($_.Size/1GB,2)}}, @{Name=''Free_GB'';Expression={[math]::Round($_.FreeSpace/1GB,2)}}, @{Name=''Used_GB'';Expression={[math]::Round(($_.Size - $_.FreeSpace)/1GB,2)}}, @{Name=''PercentFree'';Expression={[math]::Round(($_.FreeSpace/$_.Size)*100,1)}} | Format-Table -AutoSize'

  - name: host-top
    trigger: "/host {host} top"
    description: "Top CPU-consuming processes on {host}"
    details: "Inspects running processes sorted by CPU usage. Uses 'ps aux' on Linux and Get-Process on Windows."
    examples:
      - "/host home top"
      - "/host AMD top"
    command:
      shell: "ps aux --sort=-%cpu | head -n 11"
      ps1: "Get-Process | Sort-Object CPU -Descending | Select-Object -First 10 Id, ProcessName, @{Name='CPU_s';Expression={[math]::Round($_.CPU,2)}}, @{Name='RAM_MB';Expression={[math]::Round($_.WorkingSet/1MB,2)}} | Format-Table -AutoSize"

  - name: host-reboot
    trigger: "/host {host} reboot"
    description: "Reboot remote host after warning"
    details: "Safely reboots the remote host. Schedules shutdown on Linux or initiates shutdown warning on Windows."
    examples:
      - "/host home reboot"
      - "/host AMD reboot"
    command:
      shell: "shutdown -r +1 'Reboot requested from Slack'"
      ps1: "shutdown /r /t 10 /c 'Reboot requested from Slack'"
    timeout: 60

  - name: host-shutdown
    trigger: "/host {host} shutdown"
    description: "Shutdown remote host after warning"
    details: "Safely shuts down the remote host. Schedules power off on Linux or initiates shutdown warning on Windows."
    examples:
      - "/host home shutdown"
      - "/host AMD shutdown"
    command:
      shell: "shutdown -h +1 'Shutdown requested from Slack'"
      ps1: "shutdown /s /t 10 /c 'Shutdown requested from Slack'"
    timeout: 60

  - name: host-lock
    trigger: "/host {host} lock"
    description: "Lock active graphical user session on {host}"
    details: "Instantly locks the active graphical desktop workstation session on Windows or Linux without closing applications or losing unsaved work."
    examples:
      - "/host PC-KIDS lock"
      - "/host home lock"
    command:
      shell: "loginctl lock-sessions 2>/dev/null && echo 'Workstation session locked.' || echo 'Workstation lock signal sent.'"
      ps1: "rundll32.exe user32.dll,LockWorkStation; 'Workstation locked.'"

  - name: host-msg
    trigger: "/host {host} msg {message}"
    description: "Send desktop notification or popup message to {host}"
    details: "Displays a desktop notification or popup dialog on the user screen of the target machine."
    examples:
      - "/host PC-KIDS msg Dinner is ready!"
      - "/host PC-KIDS msg Please save your game."
    command:
      shell: "notify-send 'Cmdiqo Alert' '{message}' 2>/dev/null || wall 'Cmdiqo Alert: {message}' 2>/dev/null || true; echo 'Message delivered: {message}'"
      ps1: "if (Get-Command msg.exe -ErrorAction SilentlyContinue) { msg.exe * '{message}' 2>$null } else { $w = New-Object -ComObject Wscript.Shell; $w.Popup('{message}', 7, 'Cmdiqo Alert', 64) | Out-Null }; Write-Output ('Message delivered: ' + '{message}')"

  - name: host-events
    trigger: "/host {host} events"
    description: "Show recent system error and warning events on {host}"
    details: "Retrieves the most recent system warnings and errors from the Windows Event Log (System) or Linux systemd journal."
    examples:
      - "/host home events"
      - "/host AMD events"
    command:
      shell: "journalctl -p 4 -xb -n 12 --no-pager 2>/dev/null || dmesg -l err,warn 2>/dev/null | tail -n 12"
      ps1: "Get-WinEvent -FilterHashtable @{LogName='System'; Level=1,2,3} -MaxEvents 10 -ErrorAction SilentlyContinue | Select-Object TimeCreated, Id, LevelDisplayName, @{Name='Message';Expression={$_.Message.Split([char]10)[0].Trim()}} | Format-Table -AutoSize"
    timeout: 60

  # ---- Host Network & Diagnostics (OS Agnostic) ----------------------------
  - name: host-ping
    trigger: "/host {host} ping {target}"
    description: "Ping an IP or domain from {host} perspective"
    details: "Sends ICMP echo requests from the remote agent host to verify network routing, latency, and DNS resolution from that specific machine's network interface."
    examples:
      - "/host home ping 1.1.1.1"
      - "/host AMD ping google.com"
      - "/host PC-KIDS ping router.lan"
    command:
      shell: "ping -c 4 -W 2 {target}"
      ps1: "Test-Connection -ComputerName '{target}' -Count 4 | Select-Object Address, ResponseTime, StatusCode | Format-Table -AutoSize"

  - name: host-ports
    trigger: "/host {host} ports"
    description: "List listening network ports and owning processes on {host}"
    details: "Inspects open listening TCP and UDP sockets and reports the local port, bind address, PID, and owning process name."
    examples:
      - "/host home ports"
      - "/host AMD ports"
    command:
      shell: "ss -tulnp 2>/dev/null | grep LISTEN | head -n 30 || netstat -tuln 2>/dev/null | grep LISTEN | head -n 30"
      ps1: "Get-NetTCPConnection -State Listen | Select-Object -First 25 LocalAddress, LocalPort, OwningProcess, @{Name='Process';Expression={(Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName}} | Sort-Object LocalPort | Format-Table -AutoSize"

  - name: host-speedtest
    trigger: "/host {host} speedtest"
    description: "Run internet download speed & latency test directly on {host}"
    details: "Downloads a benchmark payload from Cloudflare CDN and computes real-time download throughput in Megabits per second (Mbps)."
    examples:
      - "/host home speedtest"
      - "/host AMD speedtest"
    command:
      shell: "res=$(curl -s -w '%{time_total} %{speed_download}' -o /dev/null https://speed.cloudflare.com/__down?bytes=10000000 2>/dev/null); t=$(echo $res | cut -d' ' -f1); s=$(echo $res | cut -d' ' -f2); mbps=$(awk \"BEGIN {printf \\\"%.2f\\\", ($s * 8) / 1000000}\" 2>/dev/null || echo 'N/A'); echo \"Cloudflare Speedtest: 10 MB in ${t}s (${mbps} Mbps)\""
      ps1: "$url = 'https://speed.cloudflare.com/__down?bytes=10000000'; $sw = [System.Diagnostics.Stopwatch]::StartNew(); $wc = New-Object System.Net.WebClient; $null = $wc.DownloadData($url); $sw.Stop(); $sec = $sw.Elapsed.TotalSeconds; $mbps = [math]::Round((10 * 8) / $sec, 2); 'Cloudflare Speedtest: 10 MB downloaded in {0:N2}s ({1} Mbps)' -f $sec, $mbps"
    timeout: 60

  # ---- Service Management (OS Agnostic) -------------------------------------
  - name: host-services
    trigger: "/host {host} services"
    description: "List active system services"
    details: "Lists active running services on the target host. Uses systemctl on Linux and Get-Service on Windows."
    examples:
      - "/host home services"
      - "/host AMD services"
    command:
      shell: "systemctl list-units --type=service --state=running --no-pager | head -n 30"
      ps1: "Get-Service | Where-Object {$_.Status -eq 'Running'} | Select-Object -First 25 Name, DisplayName | Format-Table -AutoSize"
    timeout: 60

  - name: host-service-status
    trigger: "/host {host} service status {service}"
    description: "Check status of a system service"
    details: "Queries system service state. Uses systemctl on Linux or Get-Service on Windows."
    examples:
      - "/host nas service status smbd"
      - "/host AMD service status Spooler"
    command:
      shell: "systemctl status {service} --no-pager"
      ps1: "Get-Service -Name '{service}' | Select-Object Name, DisplayName, Status, StartType | Format-List"
    timeout: 30

  - name: host-service-restart
    trigger: "/host {host} service restart {service}"
    description: "Restart a system service"
    details: "Restarts the specified system service unit. Uses systemctl on Linux or Restart-Service on Windows."
    examples:
      - "/host nas service restart smbd"
      - "/host AMD service restart Spooler"
    command:
      shell: "systemctl restart {service}"
      ps1: "Restart-Service -Name '{service}' -Force; Get-Service -Name '{service}' | Select-Object Name, DisplayName, Status"
    timeout: 60

  # ---- Docker Management (Linux only) --------------------------------------
  - name: host-docker-ps
    trigger: "/host {host} docker ps"
    description: "List running docker containers on {host}"
    details: "Lists currently active Docker containers on the specified host, formatting columns cleanly with container name, image, and status/uptime."
    examples:
      - "/host home docker ps"
      - "/host nas docker ps"
    command:
      shell: "docker ps --format '{{.Names}} | {{.Image}} | {{.Status}}'"

  - name: host-docker-restart
    trigger: "/host {host} docker restart {service}"
    description: "Restart a docker compose project on {host}"
    details: "Navigates to the service working directory (/docker/{service}) on the target host and runs 'docker compose restart {service}'."
    examples:
      - "/host home docker restart plex"
      - "/host home docker restart vaultwarden"
    command:
      shell: "docker compose restart {service}"
    cwd: "/docker/{service}"
    timeout: 300

  - name: host-docker-logs
    trigger: "/host {host} docker logs {service}"
    description: "Tail last 50 log lines of a docker container"
    details: "Fetches the most recent 50 lines of container standard output and standard error logs via 'docker logs --tail 50 {service}'."
    examples:
      - "/host home docker logs pihole"
      - "/host home docker logs plex"
    command:
      shell: "docker logs --tail 50 {service}"
    timeout: 60

  - name: host-docker-stats
    trigger: "/host {host} docker stats"
    description: "Snapshot of container CPU, RAM, and network usage"
    details: "Performs a single, non-streaming query of Docker container performance metrics ('docker stats --no-stream'), reporting live CPU percentage, memory usage/limit, and network I/O."
    examples:
      - "/host home docker stats"
    command:
      shell: "docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}'"
    timeout: 60

  # ---- Windows Agent Management (Windows only) -----------------------------
  - name: host-win-updates
    trigger: "/host {host} win updates"
    description: "Installed Windows hotfixes on {host}"
    details: "Queries Win32_QuickFixEngineering via PowerShell Get-CimInstance to list the 10 most recently installed Windows quality updates, security hotfixes, and KB numbers."
    examples:
      - "/host WIN-PC win updates"
      - "/host DESKTOP-01 win updates"
    command:
      ps1: "Get-CimInstance Win32_QuickFixEngineering | Sort-Object InstalledOn -Descending | Select-Object -First 10 HotFixID, InstalledOn | Format-Table -AutoSize"
    timeout: 180

