# ============================================================================
# cmdiqo-bot command and alias definitions
# ----------------------------------------------------------------------------
# Top-level sections:
#   aliases:  Prefix substitutions (e.g. /home -> /host home)
#   commands: Command definitions matching /lan or /host {host} ...
#
# Each command entry:
#   name        unique identifier (shown in logs/replies)
#   trigger     what you type in Slack; {placeholders} capture a single word
#   description shown in the built-in help (type "/lan" or "/host" with no arguments)
#   kind        "python" | "shell" | "ps1"
#               - python: calls a function inside the container
#               - shell : bash locally, or on a Linux/macOS agent if target is set
#               - ps1   : PowerShell on a Windows agent (requires target)
#   target      OPTIONAL agent name to run the command on (e.g. "{host}").
#               Without target (or target: local), runs inside the bot container.
#   run         command line; may use {placeholder} values
#   cwd         OPTIONAL working directory (container path, or agent path if target set)
#   timeout     OPTIONAL seconds, default: env SHELL_TIMEOUT (120)
#   handler     (kind: python) "module.submodule:function" inside the bot package
#
# Built-in commands (not defined here): /lan agents list, /lan version
# ============================================================================

aliases:
  - name: home
    input: "/home"
    output: "/host home"
    description: "Shortcut alias targeting host 'home'"
    details: "Translates any command starting with /home to /host home. For example, '/home docker ps' becomes '/host home docker ps'."
    examples:
      - "/home docker ps"
      - "/home uptime"
      - "/home docker restart plex"

  - name: wol
    input: "/wol"
    output: "/lan wake"
    description: "Shortcut alias for Wake-on-LAN booting"
    details: "Translates '/wol <target>' directly to '/lan wake <target>' to boot a machine over the network."
    examples:
      - "/wol 00:11:22:33:44:55"
      - "/wol 192.168.1.50"

commands:
  # ---- LAN operations (/lan) -----------------------------------------------
  - name: lan-devices-list
    category: lan
    trigger: "/lan devices list"
    description: "List all devices seen on the local network (ARP scan)"
    details: "Performs an ARP broadcast scan on the local subnet via arp-scan. Returns IP addresses, MAC addresses, and resolved host names. Falls back to kernel neighbour table (ip neigh) if arp-scan is unavailable."
    examples:
      - "/lan devices list"
    kind: python
    handler: "commands.devices:list_devices"

  - name: lan-wake
    category: lan
    trigger: "/lan wake {target}"
    description: "Send Wake-on-LAN magic packet to boot a machine"
    details: "Constructs and broadcasts a UDP magic packet (6x 0xFF followed by 16 repetitions of target MAC) on port 9. Target can be a MAC address (00:11:22:33:44:55) or an IP address (automatically resolved via local ARP cache). Target machine must have Wake-on-LAN enabled in BIOS/UEFI."
    examples:
      - "/lan wake 00:11:22:33:44:55"
      - "/lan wake 192.168.1.50"
    kind: python
    handler: "commands.devices:send_wake_on_lan"

  - name: lan-ping
    category: lan
    trigger: "/lan ping {host}"
    description: "Ping a host or IP from the Hub container"
    details: "Sends 3 ICMP echo request packets to verify network connectivity and latency to a local or remote host from the Cmdiqo container."
    examples:
      - "/lan ping 192.168.1.1"
      - "/lan ping nas.lan"
    kind: python
    handler: "commands.devices:ping_host"

  # ---- Host-agnostic operations (/host <host> <action>) --------------------
  # User Management
  - name: host-users
    category: system
    trigger: "/host {host} users"
    description: "List all OS users on {host} (active ✔️ or locked 🚫)"
    details: "Lists all local OS users on the target host indicating whether each user account is active (✔️) or locked (🚫)."
    examples:
      - "/host home users"
      - "/host AMD users"
    kind: python
    target: "{host}"
    handler: "commands.users:manage_users"

  - name: host-user-status
    category: system
    trigger: "/host {host} user {user} status"
    description: "Show user info, status (✔️/🚫), and session duration"
    details: "Displays user profile details including full name, home directory, status (✔️ active or 🚫 locked), and active session duration (h, m, s)."
    examples:
      - "/host home user john status"
      - "/host AMD user Administrator status"
    kind: python
    target: "{host}"
    handler: "commands.users:manage_users"

  - name: host-user-disable
    category: system
    trigger: "/host {host} user {user} disable"
    description: "Lock / disable user account on {host}"
    details: "Locks the specified user account (disables login) on target host."
    examples:
      - "/host home user john disable"
      - "/host AMD user tempuser disable"
    kind: python
    target: "{host}"
    handler: "commands.users:manage_users"

  - name: host-user-enable
    category: system
    trigger: "/host {host} user {user} enable"
    description: "Unlock / enable user account on {host}"
    details: "Unlocks and reactivates the specified user account on target host."
    examples:
      - "/host home user john enable"
      - "/host AMD user tempuser enable"
    kind: python
    target: "{host}"
    handler: "commands.users:manage_users"

  # System Health & Performance
  - name: host-uptime
    category: system
    trigger: "/host {host} uptime"
    description: "Show system uptime and load average"
    details: "Displays system uptime. Runs 'uptime' on Linux or queries Win32_OperatingSystem via PowerShell on Windows."
    examples:
      - "/host home uptime"
      - "/host AMD uptime"
    kind: shell
    target: "{host}"
    run: "uptime"
    windows_kind: ps1
    windows_run: "$b = (Get-CimInstance Win32_OperatingSystem).LastBootUpTime; $u = (Get-Date) - $b; 'Uptime: {0}d {1}h {2}m {3}s (Booted: {4:yyyy-MM-dd HH:mm:ss})' -f [int]$u.TotalDays, $u.Hours, $u.Minutes, $u.Seconds, $b"

  - name: host-memory
    category: system
    trigger: "/host {host} memory"
    description: "Show free and used RAM memory"
    details: "Displays total, free, and used physical RAM. Uses 'free -h' on Linux and PowerShell Win32_OperatingSystem on Windows."
    examples:
      - "/host home memory"
      - "/host AMD memory"
    kind: shell
    target: "{host}"
    run: "free -h"
    windows_kind: ps1
    windows_run: "Get-CimInstance Win32_OperatingSystem | Select-Object @{Name='Total_GB';Expression={[math]::Round($_.TotalVisibleMemorySize/1MB,2)}}, @{Name='Free_GB';Expression={[math]::Round($_.FreePhysicalMemory/1MB,2)}}, @{Name='Used_GB';Expression={[math]::Round(($_.TotalVisibleMemorySize - $_.FreePhysicalMemory)/1MB,2)}}, @{Name='UsedPercent';Expression={[math]::Round((($_.TotalVisibleMemorySize - $_.FreePhysicalMemory)/$_.TotalVisibleMemorySize)*100,1)}} | Format-Table -AutoSize"

  - name: host-disk
    category: system
    trigger: "/host {host} disk"
    description: "Disk usage on {host}"
    details: "Reports filesystem and drive usage. Runs 'df -h' on Linux or queries Win32_LogicalDisk via PowerShell on Windows."
    examples:
      - "/host home disk"
      - "/host AMD disk"
    kind: shell
    target: "{host}"
    run: "df -h"
    windows_kind: ps1
    windows_run: 'Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | Select-Object DeviceID, VolumeName, @{Name=''Total_GB'';Expression={[math]::Round($_.Size/1GB,2)}}, @{Name=''Free_GB'';Expression={[math]::Round($_.FreeSpace/1GB,2)}}, @{Name=''Used_GB'';Expression={[math]::Round(($_.Size - $_.FreeSpace)/1GB,2)}}, @{Name=''PercentFree'';Expression={[math]::Round(($_.FreeSpace/$_.Size)*100,1)}} | Format-Table -AutoSize'

  - name: host-top
    category: system
    trigger: "/host {host} top"
    description: "Top CPU-consuming processes on {host}"
    details: "Inspects running processes sorted by CPU usage. Uses 'ps aux' on Linux and Get-Process on Windows."
    examples:
      - "/host home top"
      - "/host AMD top"
    kind: shell
    target: "{host}"
    run: "ps aux --sort=-%cpu | head -n 11"
    windows_kind: ps1
    windows_run: "Get-Process | Sort-Object CPU -Descending | Select-Object -First 10 Id, ProcessName, @{Name='CPU_s';Expression={[math]::Round($_.CPU,2)}}, @{Name='RAM_MB';Expression={[math]::Round($_.WorkingSet/1MB,2)}} | Format-Table -AutoSize"

  - name: host-reboot
    category: system
    trigger: "/host {host} reboot"
    description: "Reboot remote host after warning"
    details: "Safely reboots the remote host. Schedules shutdown on Linux or initiates shutdown warning on Windows."
    examples:
      - "/host home reboot"
      - "/host AMD reboot"
    kind: shell
    target: "{host}"
    run: "shutdown -r +1 'Reboot requested from Slack'"
    windows_kind: ps1
    windows_run: "shutdown /r /t 10 /c 'Reboot requested from Slack'"
    timeout: 60

  - name: host-shutdown
    category: system
    trigger: "/host {host} shutdown"
    description: "Shutdown remote host after warning"
    details: "Safely shuts down the remote host. Schedules power off on Linux or initiates shutdown warning on Windows."
    examples:
      - "/host home shutdown"
      - "/host AMD shutdown"
    kind: shell
    target: "{host}"
    run: "shutdown -h +1 'Shutdown requested from Slack'"
    windows_kind: ps1
    windows_run: "shutdown /s /t 10 /c 'Shutdown requested from Slack'"
    timeout: 60

  # Service Management
  - name: host-services
    category: services
    trigger: "/host {host} services"
    description: "List active system services"
    details: "Lists active running services on the target host. Uses systemctl on Linux and Get-Service on Windows."
    examples:
      - "/host home services"
      - "/host AMD services"
    kind: shell
    target: "{host}"
    run: "systemctl list-units --type=service --state=running --no-pager | head -n 30"
    windows_kind: ps1
    windows_run: "Get-Service | Where-Object {$_.Status -eq 'Running'} | Select-Object -First 25 Name, DisplayName | Format-Table -AutoSize"
    timeout: 60

  - name: host-service-status
    category: services
    trigger: "/host {host} service status {service}"
    description: "Check status of a system service"
    details: "Queries system service state. Uses systemctl on Linux or Get-Service on Windows."
    examples:
      - "/host nas service status smbd"
      - "/host AMD service status Spooler"
    kind: shell
    target: "{host}"
    run: "systemctl status {service} --no-pager"
    windows_kind: ps1
    windows_run: "Get-Service -Name '{service}' | Select-Object Name, DisplayName, Status, StartType | Format-List"
    timeout: 30

  - name: host-service-restart
    category: services
    trigger: "/host {host} service restart {service}"
    description: "Restart a system service"
    details: "Restarts the specified system service unit. Uses systemctl on Linux or Restart-Service on Windows."
    examples:
      - "/host nas service restart smbd"
      - "/host AMD service restart Spooler"
    kind: shell
    target: "{host}"
    run: "systemctl restart {service}"
    windows_kind: ps1
    windows_run: "Restart-Service -Name '{service}' -Force; Get-Service -Name '{service}' | Select-Object Name, DisplayName, Status"
    timeout: 60

  # Docker Management
  - name: host-docker-ps
    category: docker
    trigger: "/host {host} docker ps"
    description: "List running docker containers on {host}"
    details: "Lists currently active Docker containers on the specified host, formatting columns cleanly with container name, image, and status/uptime."
    examples:
      - "/host home docker ps"
      - "/host nas docker ps"
    kind: shell
    target: "{host}"
    run: "docker ps --format '{{.Names}} | {{.Image}} | {{.Status}}'"

  - name: host-docker-restart
    category: docker
    trigger: "/host {host} docker restart {service}"
    description: "Restart a docker compose project on {host}"
    details: "Navigates to the service working directory (/docker/{service}) on the target host and runs 'docker compose restart {service}'."
    examples:
      - "/host home docker restart plex"
      - "/host home docker restart vaultwarden"
    kind: shell
    target: "{host}"
    run: "docker compose restart {service}"
    cwd: "/docker/{service}"
    timeout: 300

  - name: host-docker-logs
    category: docker
    trigger: "/host {host} docker logs {service}"
    description: "Tail last 50 log lines of a docker container"
    details: "Fetches the most recent 50 lines of container standard output and standard error logs via 'docker logs --tail 50 {service}'."
    examples:
      - "/host home docker logs pihole"
      - "/host home docker logs plex"
    kind: shell
    target: "{host}"
    run: "docker logs --tail 50 {service}"
    timeout: 60

  - name: host-docker-stats
    category: docker
    trigger: "/host {host} docker stats"
    description: "Snapshot of container CPU, RAM, and network usage"
    details: "Performs a single, non-streaming query of Docker container performance metrics ('docker stats --no-stream'), reporting live CPU percentage, memory usage/limit, and network I/O."
    examples:
      - "/host home docker stats"
    kind: shell
    target: "{host}"
    run: "docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.NetIO}}'"
    timeout: 60

  # Windows Agent Management (ps1)
  - name: host-win-updates
    category: windows
    trigger: "/host {host} win updates"
    description: "Installed Windows hotfixes on {host}"
    details: "Queries Win32_QuickFixEngineering via PowerShell Get-CimInstance to list the 10 most recently installed Windows quality updates, security hotfixes, and KB numbers."
    examples:
      - "/host WIN-PC win updates"
      - "/host DESKTOP-01 win updates"
    kind: ps1
    target: "{host}"
    run: "Get-CimInstance Win32_QuickFixEngineering | Sort-Object InstalledOn -Descending | Select-Object -First 10 HotFixID, InstalledOn | Format-Table -AutoSize"
    timeout: 180

  - name: host-win-memory
    category: windows
    trigger: "/host {host} win memory"
    description: "Memory usage on Windows machine"
    details: "Queries Win32_OperatingSystem via PowerShell Get-CimInstance to report total installed physical RAM (GB) and currently free/available RAM (GB)."
    examples:
      - "/host WIN-PC win memory"
    kind: ps1
    target: "{host}"
    run: "Get-CimInstance Win32_OperatingSystem | Select-Object @{Name='TotalRAM_GB';Expression={[math]::Round($_.TotalVisibleMemorySize/1MB,2)}}, @{Name='FreeRAM_GB';Expression={[math]::Round($_.FreePhysicalMemory/1MB,2)}} | Format-Table -AutoSize"
    timeout: 60

  - name: host-win-services
    category: windows
    trigger: "/host {host} win services"
    description: "Running Windows services"
    details: "Queries Windows Service Control Manager via PowerShell Get-Service to list active running services with their system name and friendly display name."
    examples:
      - "/host WIN-PC win services"
    kind: ps1
    target: "{host}"
    run: "Get-Service | Where-Object {$_.Status -eq 'Running'} | Select-Object -First 25 Name, DisplayName | Format-Table -AutoSize"
    timeout: 60

  - name: host-win-reboot
    category: windows
    trigger: "/host {host} win reboot"
    description: "Reboot Windows machine after 10 seconds warning"
    details: "Issues Windows shutdown utility ('shutdown /r /t 10') with a comment banner to safely reboot the remote machine after giving users a 10-second warning."
    examples:
      - "/host WIN-PC win reboot"
    kind: ps1
    target: "{host}"
    run: "shutdown /r /t 10 /c 'Reboot requested from Slack'"
    timeout: 60

  - name: host-win-shutdown
    category: windows
    trigger: "/host {host} win shutdown"
    description: "Shutdown Windows machine after 10 seconds warning"
    details: "Issues Windows shutdown utility ('shutdown /s /t 10') with a comment banner to safely shut down the remote machine after giving users a 10-second warning."
    examples:
      - "/host WIN-PC win shutdown"
    kind: ps1
    target: "{host}"
    run: "shutdown /s /t 10 /c 'Shutdown requested from Slack'"
    timeout: 60

  # Parental Controls (YouTube, Roblox, Minecraft & Discord blocking - Windows & Linux)
  - name: host-parental
    category: services
    trigger: "/host {host} parental {action}"
    description: "Manage YouTube, Roblox, Minecraft & Discord parental blocking on Windows or Linux (on | off | status)"
    details: "Configures system-level hosts file blocking on target Windows or Linux agent. When 'on', redirects YouTube, Roblox, Minecraft, and Discord domains to 0.0.0.0 and flushes DNS cache. When 'off', comments out entries and flushes DNS. 'status' reports the current blocking status."
    examples:
      - "/host AMD parental on"
      - "/host nas parental on"
      - "/host AMD parental off"
      - "/host nas parental status"
    kind: python
    target: "{host}"
    handler: "commands.parental:manage_parental"
