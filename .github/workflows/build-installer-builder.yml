name: Build & Publish C++ Builder Image (Docker Hub)

on:
  push:
    branches: [main]
    paths:
      - "installer.c/Dockerfile"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform builder to compile and publish"
        type: choice
        options:
          - all
          - linux
          - windows
        default: all
      push:
        description: "Push built container images to Docker Hub"
        type: boolean
        default: true
      docker_user:
        description: "Docker Hub organization/user namespace"
        type: string
        default: lhotakj

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Publish C++ Builder Images
    runs-on: ubuntu-24.04

    steps:
      - name: Free runner disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell
          sudo docker image prune --all --force || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || inputs.push == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || inputs.docker_user || 'lhotakj' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Publish C++ Container via setup-env.sh
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || inputs.docker_user || 'lhotakj' }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          chmod +x installer.c/setup-env.sh
          PLATFORM="${{ inputs.platform || 'all' }}"
          DOCKER_USER="${{ inputs.docker_user || 'lhotakj' }}"

          EXTRA_ARGS=()
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.push }}" == "true" ]]; then
            EXTRA_ARGS+=(--push)
          fi

          ./installer.c/setup-env.sh --platform "$PLATFORM" --docker-user "$DOCKER_USER" "${EXTRA_ARGS[@]}"

      - name: Release BuildKit cache before verification
        run: docker buildx prune --all --force

      - name: Verify builder image can compile the installer GUI
        shell: bash
        env:
          DOCKER_USER: ${{ inputs.docker_user || 'lhotakj' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          set -euo pipefail

          case "$PLATFORM" in
            linux) IMAGE="${DOCKER_USER}/cmdiqo-installer-builder:ubuntu-22.04"; TARGETS=(linux-x64) ;;
            windows) IMAGE="${DOCKER_USER}/cmdiqo-installer-builder:windows-mingw"; TARGETS=(windows-x64-mingw) ;;
            all) IMAGE="${DOCKER_USER}/cmdiqo-installer-builder:all"; TARGETS=(linux-x64 windows-x64-mingw) ;;
          esac

          for PRESET in "${TARGETS[@]}"; do
            case "$PRESET" in
              linux-x64) INSTALLED_DIR_VAR=VCPKG_INSTALLED_DIR_LINUX; ARTIFACT=cmdiqo-agent-setup ;;
              windows-x64-mingw) INSTALLED_DIR_VAR=VCPKG_INSTALLED_DIR_WINDOWS; ARTIFACT=cmdiqo-agent-setup.exe ;;
            esac

            # Smoke test only: the image must already contain every vcpkg dependency,
            # so manifest installation is disabled (-DVCPKG_MANIFEST_INSTALL=OFF).
            # A missing pre-built dependency fails the configure step within seconds
            # instead of silently recompiling the whole vcpkg tree from source.
            docker run --rm \
              --platform linux/amd64 \
              --user "$(id -u):$(id -g)" \
              --workdir /workspace/installer.c \
              --volume "${GITHUB_WORKSPACE}:/workspace" \
              --env HOME=/tmp \
              --env WINEPREFIX=/tmp/cmdiqo-wine \
              --env CMDIQO_BUILD_VERSION=0.9.ci \
              --env "INSTALLED_DIR_VAR=${INSTALLED_DIR_VAR}" \
              --env "PRESET=${PRESET}" \
              --env "ARTIFACT=${ARTIFACT}" \
              "$IMAGE" bash -euxo pipefail -c '
                INSTALLED_DIR="${!INSTALLED_DIR_VAR}"
                test -d "${INSTALLED_DIR}"
                cmake --fresh --preset "${PRESET}" \
                  "-DVCPKG_INSTALLED_DIR=${INSTALLED_DIR}" \
                  -DVCPKG_MANIFEST_INSTALL=OFF
                cmake --build --preset "build-${PRESET}" --config Release
                file "out/build/${PRESET}/${ARTIFACT}"
                ctest --preset "test-${PRESET}" -C Release --output-on-failure
              '
          done
