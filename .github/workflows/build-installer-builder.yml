name: Build & Publish C++ Builder Image (Docker Hub)

on:
  push:
    branches: [main]
    paths:
      - "installer.c/**"
      - ".github/workflows/build-installer-builder.yml"
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform builder to compile and publish"
        type: choice
        options:
          - all
          - linux
          - windows
        default: all
      push:
        description: "Push built container images to Docker Hub"
        type: boolean
        default: true
      docker_user:
        description: "Docker Hub organization/user namespace"
        type: string
        default: lhotakj

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Publish C++ Builder Images
    runs-on: ubuntu-24.04

    steps:
      - name: Free runner disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell
          sudo docker image prune --all --force || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'workflow_dispatch' || inputs.push == true
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || inputs.docker_user || 'lhotakj' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Publish C++ Container via setup-env.sh
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || inputs.docker_user || 'lhotakj' }}
        run: |
          chmod +x installer.c/setup-env.sh
          PLATFORM="${{ inputs.platform || 'all' }}"
          DOCKER_USER="${{ inputs.docker_user || 'lhotakj' }}"

          EXTRA_ARGS=()
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ inputs.push }}" == "true" ]]; then
            EXTRA_ARGS+=(--push)
          fi

          ./installer.c/setup-env.sh --platform "$PLATFORM" --docker-user "$DOCKER_USER" "${EXTRA_ARGS[@]}"

      - name: Release BuildKit cache before verification
        run: docker buildx prune --all --force

      - name: Verify native installer toolchains
        shell: bash
        env:
          DOCKER_USER: ${{ inputs.docker_user || 'lhotakj' }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          case "$PLATFORM" in
            linux) IMAGE="${DOCKER_USER}/cmdiqo-installer-builder:ubuntu-22.04"; PRESETS=(linux-x64) ;;
            windows) IMAGE="${DOCKER_USER}/cmdiqo-installer-builder:windows-mingw"; PRESETS=(windows-x64-mingw) ;;
            all) IMAGE="${DOCKER_USER}/cmdiqo-installer-builder:all"; PRESETS=(linux-x64 windows-x64-mingw) ;;
          esac

          for PRESET in "${PRESETS[@]}"; do
            docker run --rm \
              --workdir /workspace/installer.c \
              --volume "${GITHUB_WORKSPACE}:/workspace" \
              --env CMDIQO_BUILD_VERSION=0.9.ci \
              "$IMAGE" bash -euxo pipefail -c "
                cmake --fresh --preset ${PRESET}
                cmake --build --preset build-${PRESET} --config Release
                ctest --preset test-${PRESET} -C Release --output-on-failure
              "
          done
