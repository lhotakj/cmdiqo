name: docker-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    name: Check Commit Message for Release Triggers
    runs-on: ubuntu-24.04
    outputs:
      release_agent: ${{ steps.check.outputs.release_agent }}
      release_bot: ${{ steps.check.outputs.release_bot }}
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
      short_version: ${{ steps.check.outputs.short_version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse commit message
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python development/check_release.py

  docker:
    name: Build & Publish Multi-Arch Docker Image
    needs: [check-release]
    if: needs.check-release.outputs.release_bot == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Synchronize Version from Release Resolution
        run: |
          python development/update_version.py --version ${{ needs.check-release.outputs.version }}

      - name: Ensure GitHub Release Tag Exists
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-release.outputs.tag }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "[+] Creating release tag $TAG on GitHub..."
            gh release create "$TAG" --title "Release $TAG" --generate-notes
          else
            echo "[+] Release $TAG already exists on GitHub."
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'lhotakj' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'lhotakj' }}/cmdiqo-bot
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.check-release.outputs.version }}
            type=raw,value=${{ needs.check-release.outputs.short_version }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
