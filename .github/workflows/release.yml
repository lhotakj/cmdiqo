name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.10.0, defaults to version.txt)"
        required: false
        type: string
      release:
        description: "Create GitHub Release and publish artifacts"
        type: boolean
        default: true
      push_docker:
        description: "Push container images to Docker Hub"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build All Apps & Docker (Release on /release)
    runs-on: ubuntu-24.04
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME || 'lhotakj' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_RUN_NUMBER: ${{ github.run_number }}
      BUILD_ID: ${{ github.run_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse release trigger
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_TARGET: "all"
          DISPATCH_RELEASE: ${{ inputs.release }}
          DISPATCH_PUSH_DOCKER: ${{ inputs.push_docker }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          BUILD_ID: ${{ github.run_number }}
        run: python development/check_release.py

      - name: Set up QEMU (multi-arch Docker)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_TOKEN != '' && (steps.check.outputs.release_bot == 'true' || (github.event_name == 'workflow_dispatch' && inputs.push_docker))
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Synchronize build version
        run: python development/update_version.py --version ${{ steps.check.outputs.version }}

      - name: Execute build.sh
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
          IS_RELEASE: ${{ steps.check.outputs.is_release }}
          PUSH_DOCKER: ${{ inputs.push_docker || steps.check.outputs.release_bot == 'true' }}
        run: |
          BUILD_ARGS=("--clean" "-v" "$VERSION" "--all" "--platform" "all" "--installer")
          if [ "$PUSH_DOCKER" = "true" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "[+] Enabling Docker image publishing to Docker Hub..."
            BUILD_ARGS+=("--push" "--docker-user" "$DOCKERHUB_USERNAME")
          fi
          echo "[*] Invoking: ./build.sh ${BUILD_ARGS[*]}"
          ./build.sh "${BUILD_ARGS[@]}"

      - name: Verify distribution artifacts
        shell: bash
        run: |
          echo "=== Distribution directory contents ==="
          ls -la dist/
          for f in cmdiqo-agent cmdiqo-agent.exe cmdiqo-agent-linux-arm64 cmdiqo-agent-linux-x64.zip cmdiqo-agent-linux-arm64.zip cmdiqo-agent-windows-x64.zip cmdiqo-agent-linux-x64-setup cmdiqo-agent-linux-arm64-setup cmdiqo-agent-windows-x64-setup.exe; do
            test -f "dist/$f" || { echo "[-] Missing dist/$f"; exit 1; }
          done
          echo "[+] All Linux (x64 & ARM64) and Windows native agent binaries and setups verified successfully!"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmdiqo-artifacts-${{ steps.check.outputs.version }}
          path: dist/cmdiqo-agent*
          retention-days: 90
          if-no-files-found: warn

      - name: Generate Release Summary
        shell: bash
        env:
          VERSION: ${{ steps.check.outputs.version }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python development/generate_release_summary.py \
            -v "$VERSION" \
            --dist dist \
            --docker-user "$DOCKERHUB_USERNAME" \
            --repo "$GITHUB_REPOSITORY" \
            --commit-message "$COMMIT_MESSAGE" \
            -o dist/release-notes.md \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: steps.check.outputs.is_release == 'true'
        shell: bash
        env:
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          echo "[*] Target GitHub Release: $TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[+] Release $TAG already exists on GitHub. Updating..."
            gh release upload "$TAG" dist/cmdiqo-agent* --clobber
            gh release edit "$TAG" --notes-file dist/release-notes.md
          else
            echo "[+] Creating new release $TAG on GitHub with release notes..."
            gh release create "$TAG" dist/cmdiqo-agent* \
              --title "Release $TAG" \
              --notes-file dist/release-notes.md
          fi
          echo "[SUCCESS] GitHub Release $TAG published successfully!"
