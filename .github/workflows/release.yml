name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version override (e.g. 0.10.0, defaults to version.txt)"
        required: false
        type: string
      release:
        description: "Create GitHub Release and publish artifacts"
        type: boolean
        default: true
      push_docker:
        description: "Push container images to Docker Hub"
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  check-release:
    name: Check Release Trigger & Version
    runs-on: ubuntu-24.04
    outputs:
      is_release: ${{ steps.check.outputs.is_release }}
      release_agent: ${{ steps.check.outputs.release_agent }}
      release_bot: ${{ steps.check.outputs.release_bot }}
      version: ${{ steps.check.outputs.version }}
      short_version: ${{ steps.check.outputs.short_version }}
      tag: ${{ steps.check.outputs.tag }}
      trigger_reason: ${{ steps.check.outputs.trigger_reason }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse release trigger
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_VERSION: ${{ inputs.version }}
          DISPATCH_TARGET: "all"
          DISPATCH_RELEASE: ${{ inputs.release }}
          DISPATCH_PUSH_DOCKER: ${{ inputs.push_docker }}
        run: |
          python development/check_release.py

  build-and-release:
    name: Build All Apps & Docker (Release on /release)
    needs: [check-release]
    runs-on: ubuntu-24.04
    steps:
      - name: Free runner disk space
        run: |
          echo "=== Disk space before cleanup ==="
          df -h
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/swift \
            /usr/local/share/powershell \
            || true
          sudo docker image prune --all --force || true
          echo "=== Disk space after cleanup ==="
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up QEMU (multi-arch Docker)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || 'lhotakj' }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Synchronize build version
        run: |
          python development/update_version.py --version ${{ needs.check-release.outputs.version }}

      - name: Execute build.sh
        shell: bash
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || 'lhotakj' }}
          IS_RELEASE: ${{ needs.check-release.outputs.is_release }}
          PUSH_DOCKER: ${{ inputs.push_docker || needs.check-release.outputs.is_release }}
        run: |
          BUILD_ARGS=("--clean" "-v" "$VERSION" "--all" "--platform" "all" "--installer")

          if [ "$PUSH_DOCKER" = "true" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "[+] Enabling Docker image publishing to Docker Hub..."
            BUILD_ARGS+=("--push" "--docker-user" "$DOCKER_USER")
          fi

          echo "[*] Invoking: ./build.sh ${BUILD_ARGS[*]}"
          ./build.sh "${BUILD_ARGS[@]}"

      - name: Verify distribution artifacts
        shell: bash
        run: |
          echo "=== Distribution directory contents ==="
          ls -la dist/

          echo "[*] Verifying native agent binaries and installer packages..."
          test -f dist/cmdiqo-agent
          test -f dist/cmdiqo-agent.exe
          test -f dist/cmdiqo-agent-linux-x64.zip
          test -f dist/cmdiqo-agent-windows-x64.zip
          test -f dist/cmdiqo-agent-linux-x64-setup
          test -f dist/cmdiqo-agent-windows-x64-setup.exe
          echo "[+] All Linux and Windows native agent binaries and setups verified successfully!"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cmdiqo-artifacts-${{ needs.check-release.outputs.version }}
          path: |
            dist/cmdiqo-agent
            dist/cmdiqo-agent.exe
            dist/cmdiqo-agent-linux-x64.zip
            dist/cmdiqo-agent-windows-x64.zip
            dist/cmdiqo-agent-linux-x64-setup
            dist/cmdiqo-agent-windows-x64-setup.exe
            dist/cmdiqo-agent.cer
          retention-days: 90
          if-no-files-found: warn

      - name: Generate Release Summary
        shell: bash
        env:
          VERSION: ${{ needs.check-release.outputs.version }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME || 'lhotakj' }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python development/generate_release_summary.py \
            -v "$VERSION" \
            --dist dist \
            --docker-user "$DOCKER_USER" \
            --commit-message "$COMMIT_MESSAGE" \
            -o dist/release-notes.md \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        if: needs.check-release.outputs.is_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-release.outputs.tag }}
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          echo "[*] Target GitHub Release: $TAG (version $VERSION)"
          shopt -s nullglob
          RELEASE_FILES=()
          CANDIDATES=(
            dist/cmdiqo-agent
            dist/cmdiqo-agent.exe
            dist/cmdiqo-agent-linux-x64.zip
            dist/cmdiqo-agent-windows-x64.zip
            dist/cmdiqo-agent-linux-x64-setup
            dist/cmdiqo-agent-windows-x64-setup.exe
            dist/cmdiqo-agent.cer
          )
          for f in "${CANDIDATES[@]}"; do
            if [ -f "$f" ]; then
              RELEASE_FILES+=("$f")
            fi
          done

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[+] Release $TAG already exists on GitHub."
            if [ ${#RELEASE_FILES[@]} -gt 0 ]; then
              echo "[+] Uploading release assets..."
              gh release upload "$TAG" "${RELEASE_FILES[@]}" --clobber
            fi
            if [ -f dist/release-notes.md ]; then
              echo "[+] Updating release notes..."
              gh release edit "$TAG" --notes-file dist/release-notes.md
            fi
          else
            echo "[+] Creating new release $TAG on GitHub with release notes..."
            gh release create "$TAG" "${RELEASE_FILES[@]}" \
              --title "Release $TAG" \
              --notes-file dist/release-notes.md
          fi
          echo "[SUCCESS] GitHub Release $TAG published successfully!"
