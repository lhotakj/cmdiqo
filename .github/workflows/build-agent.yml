name: Build Agent Binaries (Windows & Linux x64)

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "development/**"
      - ".github/workflows/build-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "development/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.os }} Standalone Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: shango-agent-linux-x64
            binary_src: dist/shango-agent
            binary_dest: shango-agent-linux-x64
          - os: windows-latest
            artifact_name: shango-agent-windows-x64
            binary_src: dist/shango-agent.exe
            binary_dest: shango-agent-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies, UPX & PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r agent/requirements.txt
          if [[ "${{ matrix.os }}" == "ubuntu"* ]]; then
            sudo apt-get update && sudo apt-get install -y upx
          elif [[ "${{ matrix.os }}" == "windows"* ]]; then
            choco install upx -y || true
          fi

      - name: Build and Sign Standalone Binary
        shell: bash
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          python development/build_agent.py

      - name: Verify Windows Signature & Certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "[+] Verifying Authenticode signature of ${{ matrix.binary_src }}:"
          Get-AuthenticodeSignature "${{ matrix.binary_src }}" | Format-List Status, StatusMessage, SignatureType, SignerCertificate, TimeStamperCertificate

      - name: Prepare binary artifact
        shell: bash
        run: |
          mv ${{ matrix.binary_src }} ${{ matrix.binary_dest }}
          chmod +x ${{ matrix.binary_dest }} || true

      - name: Upload Binary Artifact (for direct download)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.binary_dest }}
            shango-agent.cer
          retention-days: 90
          if-no-files-found: warn
