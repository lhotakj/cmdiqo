name: Build Agent Binaries (Windows & Linux x64)

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "development/**"
      - ".github/workflows/build-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "development/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.os }} Standalone Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: cmdiqo-agent-linux-x64
            binary_src: dist/cmdiqo-agent
            binary_dest: cmdiqo-agent-linux-x64
            zip_src: dist/cmdiqo-agent-linux-x64.zip
          - os: windows-latest
            artifact_name: cmdiqo-agent-windows-x64
            binary_src: dist/cmdiqo-agent.exe
            binary_dest: cmdiqo-agent-windows-x64.exe
            zip_src: dist/cmdiqo-agent-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies, UPX & PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r agent/requirements.txt
          if [[ "${{ matrix.os }}" == "ubuntu"* ]]; then
            sudo apt-get update && sudo apt-get install -y upx
          elif [[ "${{ matrix.os }}" == "windows"* ]]; then
            choco install upx -y || true
          fi

      - name: Build and Sign Standalone Binary
        shell: bash
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          python development/build_agent.py

      - name: Verify Windows Signature & Certificate
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Write-Host "[+] Verifying Authenticode signature of ${{ matrix.binary_src }}:"
          Get-AuthenticodeSignature "${{ matrix.binary_src }}" | Format-List Status, StatusMessage, SignatureType, SignerCertificate, TimeStamperCertificate

      - name: Stage Package Files
        shell: bash
        run: |
          mkdir -p dist/package
          if [[ "${{ matrix.os }}" == "windows"* ]]; then
            cp dist/cmdiqo-agent.exe dist/package/cmdiqo-agent.exe
            cp dist/cmdiqo-agent.exe dist/package/cmdiqo-agent-windows-x64.exe
            cp agent/install-service.ps1 dist/package/
            cp agent/uninstall-service.ps1 dist/package/
            cp agent/agent.env.example dist/package/
            cp agent/agent.json.example dist/package/
            [ -f cmdiqo-agent.cer ] && cp cmdiqo-agent.cer dist/package/ || true
            [ -f dist/cmdiqo-agent.cer ] && cp dist/cmdiqo-agent.cer dist/package/ || true
          else
            cp dist/cmdiqo-agent dist/package/cmdiqo-agent
            cp dist/cmdiqo-agent dist/package/cmdiqo-agent-linux-x64
            chmod +x dist/package/cmdiqo-agent dist/package/cmdiqo-agent-linux-x64
            cp agent/install-service.sh dist/package/
            cp agent/uninstall-service.sh dist/package/
            cp agent/cmdiqo-agent.service dist/package/
            cp agent/agent.env.example dist/package/
            cp agent/agent.json.example dist/package/
            chmod +x dist/package/*.sh || true
          fi

      - name: Upload Package Artifact (contains binary, install/uninstall scripts & configs)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/package/*
          retention-days: 90
          if-no-files-found: error

      - name: Upload Zip Archive Artifact (for direct zip file download)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}-zip
          path: ${{ matrix.zip_src }}
          retention-days: 90
          if-no-files-found: error
