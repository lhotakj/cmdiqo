name: Build Agent Binaries (Windows & Linux x64)

on:
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/**"
      - ".github/workflows/build-agent.yml"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"
      - "scripts/**"
      - ".github/workflows/build-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-binaries:
    name: Build ${{ matrix.os }} Standalone Binary
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: shango-agent-linux-x64
            binary_src: dist/shango-agent
            binary_dest: shango-agent-linux-x64
          - os: windows-latest
            artifact_name: shango-agent-windows-x64
            binary_src: dist/shango-agent.exe
            binary_dest: shango-agent-windows-x64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies, UPX & PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r agent/requirements.txt
          if [[ "${{ matrix.os }}" == "ubuntu"* ]]; then
            sudo apt-get update && sudo apt-get install -y upx
          elif [[ "${{ matrix.os }}" == "windows"* ]]; then
            choco install upx -y || true
          fi

      - name: Build Standalone Binary with Maximum PyInstaller & UPX Compression
        shell: bash
        run: |
          python scripts/build_agent.py

      - name: Sign Windows Binary (Authenticode)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          if ($env:SIGNING_CERT_BASE64) {
            Write-Host "[*] Using production code signing certificate from GitHub Secrets..."
            $pfxBytes = [Convert]::FromBase64String($env:SIGNING_CERT_BASE64)
            $pfxPath = "$env:RUNNER_TEMP\signing_cert.pfx"
            [IO.File]::WriteAllBytes($pfxPath, $pfxBytes)
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
              $pfxPath,
              $env:SIGNING_CERT_PASSWORD,
              [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
            )
          } else {
            Write-Host "[*] Using dedicated ShangoHub code-signing certificate..."
            $cert = Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object -First 1
            if (-not $cert) {
              $cert = New-SelfSignedCertificate -Type CodeSigningCert `
                -Subject "CN=ShangoHub (GitHub Actions), O=ShangoHub, OU=Verified Build" `
                -CertStoreLocation "Cert:\CurrentUser\My" `
                -HashAlgorithm SHA256 `
                -NotAfter (Get-Date).AddYears(5)
            }
          }

          # Export public certificate for users to verify or install
          Export-Certificate -Cert $cert -FilePath "shango-agent.cer"

          # Sign executable with RFC3161 timestamp server with fallback
          $tsServers = @("http://timestamp.digicert.com", "http://timestamp.sectigo.com")
          $signed = $false
          foreach ($ts in $tsServers) {
            try {
              $sig = Set-AuthenticodeSignature -FilePath "${{ matrix.binary_src }}" `
                -Certificate $cert `
                -TimestampServer $ts `
                -HashAlgorithm SHA256
              if ($sig.SignatureType -eq "Authenticode") {
                $signed = $true
                Write-Host "[+] Successfully signed with timestamp server: $ts"
                break
              }
            } catch {
              Write-Warning "Timestamp server $ts failed: $_"
            }
          }
          if (-not $signed) {
            Write-Host "[*] Signing without external timestamp server..."
            Set-AuthenticodeSignature -FilePath "${{ matrix.binary_src }}" `
              -Certificate $cert `
              -HashAlgorithm SHA256
          }

          Write-Host "[+] Verification of signed binary:"
          Get-AuthenticodeSignature "${{ matrix.binary_src }}" | Format-List

      - name: Prepare binary artifact
        shell: bash
        run: |
          mv ${{ matrix.binary_src }} ${{ matrix.binary_dest }}
          chmod +x ${{ matrix.binary_dest }} || true

      - name: Upload Binary Artifact (for direct download)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.binary_dest }}
            shango-agent.cer
          retention-days: 90
          if-no-files-found: warn
