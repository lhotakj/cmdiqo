name: Build Agent Binaries (Windows & Linux x64)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-release:
    name: Check Commit Message for Release Triggers
    runs-on: ubuntu-24.04
    outputs:
      release_agent: ${{ steps.check.outputs.release_agent }}
      release_bot: ${{ steps.check.outputs.release_bot }}
      is_release: ${{ steps.check.outputs.is_release }}
      version: ${{ steps.check.outputs.version }}
      short_version: ${{ steps.check.outputs.short_version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse commit message
        id: check
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python development/check_release.py

  build-binaries:
    name: Build ${{ matrix.os }} Agent Package
    needs: [check-release]
    if: github.event_name == 'workflow_dispatch' || needs.check-release.outputs.release_agent == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_name: cmdiqo-agent-linux-x64
            binary_src: dist/cmdiqo-agent
            binary_dest: cmdiqo-agent-linux-x64
            zip_name: cmdiqo-agent-linux-x64.zip
          - os: windows-latest
            artifact_name: cmdiqo-agent-windows-x64
            binary_src: dist/cmdiqo-agent.exe
            binary_dest: cmdiqo-agent-windows-x64.exe
            zip_name: cmdiqo-agent-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies and PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r agent/requirements.txt
          if [[ "${{ matrix.os }}" == "ubuntu"* ]]; then
            sudo apt-get update && sudo apt-get install -y upx
          fi

      - name: Build Linux agent package
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          ./build.sh --clean --platform linux64 --target agent

      - name: Build and sign Windows agent package
        if: matrix.os == 'windows-latest'
        shell: powershell
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          .\build.ps1 -Clean -Platform win64 -Target Agent

      - name: Verify Windows Signature & Certificate
        if: matrix.os == 'windows-latest'
        shell: powershell
        run: |
          $signedFiles = @("${{ matrix.binary_src }}")
          foreach ($signedFile in $signedFiles) {
            Write-Host "[+] Verifying Authenticode signature of ${signedFile}:"
            $signature = Get-AuthenticodeSignature $signedFile
            $signature | Format-List Status, StatusMessage, SignatureType, SignerCertificate, TimeStamperCertificate
            if ($signature.SignatureType -ne "Authenticode") {
              throw "Authenticode signature is missing from $signedFile."
            }
          }

      - name: Verify agent distribution archive
        shell: bash
        run: |
          if [[ "${{ matrix.os }}" == "windows"* ]]; then
            expected=(cmdiqo-agent.exe install.ps1 uninstall.ps1 agent.env.example agent.json.example version.txt)
          else
            expected=(cmdiqo-agent install.sh uninstall.sh cmdiqo-agent.service agent.env.example agent.json.example version.txt)
          fi

          test -f "${{ matrix.binary_src }}"
          python -c "import sys, zipfile; archive, *expected = sys.argv[1:]; names = set(zipfile.ZipFile(archive).namelist()); missing = set(expected) - names; assert not missing, f'{archive} is missing: {sorted(missing)}'" \
            "dist/${{ matrix.zip_name }}" "${expected[@]}"

      - name: Upload Agent Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            dist/${{ matrix.zip_name }}
            ${{ matrix.binary_src }}
            dist/cmdiqo-agent-linux-x64-setup
            dist/cmdiqo-agent-windows-x64-setup.exe
            dist/package/*
          retention-days: 90
          if-no-files-found: warn

  publish-release:
    name: Create GitHub Release & Upload Agent Packages
    needs: [check-release, build-binaries]
    if: needs.check-release.outputs.release_agent == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built packages
        uses: actions/download-artifact@v4
        with:
          path: dist/downloaded

      - name: Collect Release Assets
        shell: bash
        run: |
          mkdir -p dist/release-assets
          find dist/downloaded -name "*.zip" -exec cp {} dist/release-assets/ \;
          find dist/downloaded -name "cmdiqo-agent.cer" -exec cp {} dist/release-assets/ \; 2>/dev/null || true
          find dist/downloaded -type f \( -name "cmdiqo-agent" -o -name "cmdiqo-agent.exe" -o -name "cmdiqo-agent-linux-x64-setup" -o -name "cmdiqo-agent-windows-x64-setup.exe" \) -exec cp {} dist/release-assets/ \;
          for d in dist/downloaded/*; do
            if [ -d "$d" ]; then
              name=$(basename "$d")
              if [ ! -f "dist/release-assets/${name}.zip" ]; then
                echo "[*] Creating zip fallback for $name..."
                (cd "$d" && zip -r "../../release-assets/${name}.zip" .)
              fi
            fi
          done
          echo "[+] Prepared assets for release:"
          ls -la dist/release-assets/

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.check-release.outputs.tag }}
          VERSION: ${{ needs.check-release.outputs.version }}
        run: |
          echo "[*] Target Release: $TAG (version $VERSION)"
          shopt -s nullglob
          ASSETS=(dist/release-assets/*)
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "[+] Release $TAG already exists on GitHub. Uploading/updating assets..."
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "[+] Creating new release $TAG on GitHub..."
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Release $TAG" \
              --generate-notes
          fi
